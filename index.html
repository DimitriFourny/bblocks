<html>
  <head>
    <title>BBlocks JS framework</title>
  </head>
  <style>
    svg text, svg rect {
      -webkit-user-select: none;
       -moz-user-select: none;
        -ms-user-select: none;
            user-select: none;
    }
  </style>
  <body>
    <svg id="svg"></svg>
    <script src="./dist/bblocks.js"></script>
    <script>

// TODO: test with bigger graph! 

let blocksLines = [
  [
    "loop(int, int*, int):",
    "      test    edi, edi",
    "      jle     .LBB0_9],",
  ],
  [
    "loop(int, int*, int):@3",
    "      mov     eax, edi",
    "      mov     rcx, -1",
    "      xor     edi, edi",
    "      jmp     .LBB0_2",
  ],
  [
    ".LBB0_2:",
    "      cmp     edx, 3",
    "      je      .LBB0_7",
  ],
  [
    ".LBB0_7:",
    "      mov     r8, rdi",
    "      imul    r8, rdi",
  ],
  [
    ".LBB0_2:@21",
    "      mov     r8, rcx",
    "      cmp     edx, 2",
    "      je      .LBB0_8",
  ],
  [
    ".LBB0_2:@24",
    "      cmp     edx, 1",
    "      jne     .LBB0_5",
  ],
  [
    ".LBB0_2:@26",
    "      lea     r8, [rdi + rdi]",
    "      jmp     .LBB0_8",
  ],
  [
    ".LBB0_5:",
    "      xor     r8d, r8d",
    "      jmp     .LBB0_8",
  ],
  [
    ".LBB0_8:",
    "      movsxd  r8, r8d",
    "      inc     dword ptr [rsi + 4*r8]",
    "      inc     dword ptr [rsi + 4*rdi]",
    "      inc     rdi",
    "      add     rcx, 3",
    "      cmp     rax, rdi",
    "      je      .LBB0_9",
  ],
  [
    ".LBB0_9:",
    "      ret",
  ]
];

let arrowValidColor = "#729D5A";
let arrowInvalidColor = "#B5555A";

let links = [
  [0, 1, arrowInvalidColor],
  [0, 8],
  
  [1, 2],
  [1, 9],

  [2, 3],
  [2, 4],
  
  // [3, 9],

  [4, 5],
  [4, 9],

  [5, 6],
  [5, 7],

  // [6, 9],
  // [7, 9]
];

let svg = document.getElementById("svg");
let context = new bblocks.new(svg, blocksLines, links);
context.draw();
    </script>
  </body>
</html>
